# Cloudflare Tunnel configuration
# See https://developers.cloudflare.com/cloudflare-one/connections/connect-apps/
# for documentation on tunnel ingress rules.

# This config is used when running cloudflared in a Docker container.
# The tunnel token is passed via environment variable CLOUDFLARE_TUNNEL_TOKEN.

tunnel: archiruz-portfolio
credentials-file: /home/nonroot/.cloudflared/credentials.json

ingress:
  - hostname: archiruz.dev
    service: http://web:4321
  - hostname: www.archiruz.dev
    service: http://web:4321
  - hostname: admin.archiruz.dev
    service: http://sanity:3333
  - service: http_status:404
